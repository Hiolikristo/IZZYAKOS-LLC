name: IZZYAKOS Pages Preflight

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  pages-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Confirm GitHub Pages is enabled
        uses: actions/configure-pages@v5
