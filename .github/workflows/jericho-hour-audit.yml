name: Jericho Hour Site Audit
on:
  push:
    branches: [main]
    paths:
      - 'jericho-hour/**'
      - 'scripts/audit-jericho.mjs'
      - '.github/workflows/jericho-hour-audit.yml'
  pull_request:
    paths:
      - 'jericho-hour/**'
      - 'scripts/audit-jericho.mjs'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/audit-jericho.mjs
